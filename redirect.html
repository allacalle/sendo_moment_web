<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Momento de calma 🌿 | SenDo</title>

  <!-- Metadatos base visibles para bots -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Un Momento de calma 🌿">
  <meta property="og:description" content="Disfruta un instante de serenidad compartido desde la app SenDo.">
  <meta property="og:image" content="https://allacalle.github.io/sendo_moment_web/recursos/images/logo.png">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Un Momento de calma 🌿">
  <meta name="twitter:description" content="Disfruta un instante de serenidad compartido desde la app SenDo.">
  <meta name="twitter:image" content="https://allacalle.github.io/sendo_moment_web/recursos/images/logo.png">

  <style>
    body { font-family: system-ui, sans-serif; text-align: center; margin-top: 10%; }
    img { max-width: 80%; border-radius: 10px; margin-top: 1rem; }
  </style>

  <script>
    (function() {
      const p = new URLSearchParams(location.search);
      const img = p.get('img');
      const phrase = p.get('phrase');

      // Mostrar información en la página (para humanos)
      document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('phrase').textContent = phrase || 'Respira y sonríe 🌿';
        if (img) {
          const image = document.createElement('img');
          image.src = img;
          image.alt = 'Momento de calma';
          document.getElementById('preview').appendChild(image);
        }
      });

      // Redirigir a index.html para la experiencia completa
      setTimeout(() => {
        window.location.href = 'index.html' + location.search;
      }, 2500);
    })();
  </script>
</head>

<body>
  <h1 id="phrase">Cargando tu Momento...</h1>
  <div id="preview"></div>
  <p>Preparando tu experiencia de calma...</p>
</body>
</html>
