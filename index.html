<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Meta tags estáticos de fallback -->
    <title>Un Momento de SenDo</title>
    <meta property="og:title" content="Un Momento de SenDo" />
    <meta property="og:description" content="Una experiencia de calma compartida contigo." />
    <meta property="og:image" content="https://allacalle.github.io/sendo_moment_web/recursos/images/tree.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Un Momento de SenDo" />
    <meta name="twitter:description" content="Una experiencia de calma compartida contigo." />
    <meta name="twitter:image" content="https://allacalle.github.io/sendo_moment_web/recursos/images/tree.png" />

    <!-- Enlaces a CSS y Fonts -->
    <link rel="stylesheet" href="recursos/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https:c.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital@0;1&family=Nunito:wght@400;700&display=swap" rel="stylesheet">

    <!-- Script para actualizar meta tags dinámicamente para bots -->
    <script>
        const params = new URLSearchParams(window.location.search);
        const phrase = params.get('phrase');
        const img = params.get('img');//fonts.gstati
        const author = params.get('author');

        function setMeta(property, content, name=false) {
            let selector = name ? `meta[name="${property}"]` : `meta[property="${property}"]`;
            let meta = document.querySelector(selector);
            if (!meta) {
                meta = document.createElement('meta');
                if(name) meta.setAttribute('name', property);
                else meta.setAttribute('property', property);
                document.head.appendChild(meta);
            }
            meta.setAttribute('content', content);
        }

        if (phrase) {
            setMeta('og:title', phrase);
            setMeta('og:description', phrase);
            setMeta('twitter:title', phrase, true);
            setMeta('twitter:description', phrase, true);
            document.title = phrase;
        }

        if (img) {
            setMeta('og:image', img);
            setMeta('twitter:image', img, true);
            setMeta('og:image:alt', 'Momento de calma');
            setMeta('twitter:image:alt', 'Momento de calma', true);
        }

        if (author) {
            setMeta('og:author', author);
        }
    </script>

    <!-- Script principal -->
    <script src="recursos/js/script.js"></script>
</head>
<body>
    <main id="moment-container">
        <div id="headphone-overlay" class="overlay">
            <div class="overlay-content">
                <p>Para una mejor experiencia, te recomendamos usar auriculares.</p>
                <button id="play-anyway-button">Reproducir Audio</button>
                <button id="play-silent-button">Continuar en Silencio</button>
            </div>
        </div>

        <div id="moment-content">
            <h2 id="phrase-text"></h2>
            <p id="author-text"></p>
        </div>

        <div id="on-screen-controls">
            <div id="attribution-panel">
                <h3>Sobre los Artistas</h3>
                <div><h4>Fotografía</h4><p id="photo-artist"></p><p class="via-text">vía Pexelso</p></div>
                <div><h4>Música</h4><p id="music-title"></p><p id="music-artist"></p><p class="via-text">vía Jamendo</p></div>
                <div><h4>Frase</h4><p id="phrase-author"></p></div>
            </div>
            <div id="bottom-buttons-row">
                <div id="attribution-button"><img src="recursos/images/attribution.webp" alt="Sobre los Artistas"></div>
                <div id="audio-player"><button id="play-pause-button"></button><audio id="moment-audio" src=""></audio></div>
                <div class="button-spacer"></div>
            </div>
        </div>
    </main>

    <div id="cta-bar">
        <div id="cta-text"><p>Esto es un Momento creado con <strong>SenDo</strong>, una app gratuita para encontrar tu calma diaria.</p></div>
        <div id="cta-button"><a id="download-link" href="#" target="_blank"><img src="recursos/images/googleplay.webp" alt="Obtener en Google Play"></a></div>
    </div>

    <footer id="ad-footer">
        <div id="ad-container"></div>
        <button id="close-ad-button">×</button>
    </footer>
</body>
</html>
