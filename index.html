<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Momento de calma 🌿 | SenDo</title>

  <!-- Meta tags por defecto para bots (si no hay parámetros) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Un Momento de calma 🌿">
  <meta property="og:description" content="Disfruta un instante de serenidad compartido desde la app SenDo.">
  <meta property="og:image" content="https://allacalle.github.io/sendo_moment_web/recursos/images/logo.png">
  <meta property="og:image:alt" content="Logo de SenDo">
  <meta property="og:site_name" content="SenDo">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Un Momento de calma 🌿">
  <meta name="twitter:description" content="Disfruta un instante de serenidad compartido desde la app SenDo.">
  <meta name="twitter:image" content="https://allacalle.github.io/sendo_moment_web/recursos/images/logo.png">
  <meta name="twitter:image:alt" content="Logo de SenDo">

  <link rel="stylesheet" href="recursos/css/style.css">

  <script>
    // --- Leer parámetros de la URL ---
    const params = new URLSearchParams(window.location.search);
    const phrase = params.get('phrase');
    const author = params.get('author');
    const img = params.get('img');
    const music = params.get('music');
    const songTitle = params.get('songTitle');
    const songArtist = params.get('songArtist');
    const imgPhotographer = params.get('imgPhotographer');
    const imgPhotographerUrl = params.get('imgPhotographerUrl');
    const songArtistUrl = params.get('songArtistUrl');

    // --- Función para actualizar o crear meta tags ---
    function setMeta(property, content, name=false) {
      let selector = name ? `meta[name="${property}"]` : `meta[property="${property}"]`;
      let meta = document.querySelector(selector);
      if (!meta) {
        meta = document.createElement('meta');
        if(name) meta.setAttribute('name', property);
        else meta.setAttribute('property', property);
        document.head.appendChild(meta);
      }
      meta.setAttribute('content', content);
    }

    // --- Actualizar meta tags dinámicamente ---
    if (phrase) {
      setMeta('og:title', phrase);
      setMeta('og:description', phrase);
      setMeta('twitter:title', phrase, true);
      setMeta('twitter:description', phrase, true);
      document.title = phrase;
    }

    if (img) {
      setMeta('og:image', img);
      setMeta('twitter:image', img, true);
      setMeta('og:image:alt', 'Momento de calma');
      setMeta('twitter:image:alt', 'Momento de calma', true);
    }

    if (author) {
      setMeta('og:author', author);
    }

    if (music && songTitle && songArtist) {
      setMeta('og:music', music);
      setMeta('og:music:title', songTitle);
      setMeta('og:music:artist', songArtist);
    }

    if (imgPhotographer) {
      let creditText = imgPhotographerUrl ? `${imgPhotographer} (${imgPhotographerUrl})` : imgPhotographer;
      setMeta('og:image:credit', creditText);
    }
  </script>
</head>
<body>
  <main id="moment-container" style="text-align:center; margin-top:5%;">
    <h1 id="phrase-text">Cargando tu Momento...</h1>
    <p id="author-text" style="font-style:italic; margin-top:0.5rem;"></p>
    <div id="preview-image" style="margin-top:1rem;"></div>
    <div id="music-info" style="margin-top:1rem;"></div>
    <div id="credits" style="margin-top:1rem; font-size:0.9rem; color:#555;"></div>
  </main>

  <script>
    // --- Mostrar contenido dinámico ---
    document.getElementById('phrase-text').textContent = phrase || 'Respira y sonríe 🌿';
    document.getElementById('author-text').textContent = author ? `— ${author}` : '';

    if(img) {
      const imgEl = document.createElement('img');
      imgEl.src = img;
      imgEl.alt = 'Momento de calma';
      imgEl.style.maxWidth = '80%';
      imgEl.style.borderRadius = '10px';
      document.getElementById('preview-image').appendChild(imgEl);
    }

    if(music && songTitle && songArtist) {
      document.getElementById('music-info').textContent = `🎵 ${songTitle} — ${songArtist}`;
    }

    let creditsArr = [];
    if(imgPhotographer) creditsArr.push(imgPhotographerUrl ? `📸 ${imgPhotographer} (${imgPhotographerUrl})` : `📸 ${imgPhotographer}`);
    if(songArtist) creditsArr.push(songArtistUrl ? `🎵 ${songArtist} (${songArtistUrl})` : `🎵 ${songArtist}`);
    document.getElementById('credits').innerHTML = creditsArr.join('<br>');
  </script>
</body>
</html>
